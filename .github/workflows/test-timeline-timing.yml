# 시계열(timeline_search) 유무에 따른 소요 시간 비교 - 테스트 전용 workflow
# (2026-07-20 신규)
#
# 메인 파이프라인(run-pipeline.yml)과 완전히 분리된 1회성 진단용입니다.
# WATT/네이버 수집, BGE-M3 임베딩, LLM 요약 등은 전혀 안 돌리고,
# gdelt_collector.collect()만 키워드 2개로 두 조건(시계열 없음/있음)을
# 각각 호출해서 실제 소요 시간 차이를 잽니다.
#
# 실행 방법: Actions 탭 > "시계열 소요시간 비교 테스트" > Run workflow
# 결과 확인: 실행 로그 맨 아래 "=== 비교 결과 ===" 부분

name: 시계열 소요시간 비교 테스트

on:
  workflow_dispatch: {}

jobs:
  test-timeline-timing:
    runs-on: ubuntu-latest
    # 시계열 있는 쪽이 429/백오프를 여러 번 맞으면 키워드 2개여도 시간이
    # 꽤 걸릴 수 있어 여유 있게 설정 (최악의 경우를 감안 - 실제로는
    # 이보다 훨씬 짧게 끝날 가능성이 높음)
    timeout-minutes: 90

    steps:
      - name: 리포 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 최소 의존성만 설치 (gdeltdoc, requests)
        # 이 테스트는 gdelt_collector.py만 쓰므로 requirements.txt 전체
        # (playwright, sentence-transformers 등)는 필요 없음 - 설치 시간 절약
        run: pip install gdeltdoc requests --break-system-packages

      - name: 시계열 소요시간 비교 실행
        run: python -u test_timeline_timing.py
