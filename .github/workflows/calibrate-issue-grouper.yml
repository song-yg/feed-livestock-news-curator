name: issue_grouper 재검증 (진단, 1회성)

# 이 워크플로우는 매주 도는 news-pipeline.yml과 별개다. main.py 본 파이프라인은
# 아직 issue_grouper를 안 쓰고 있고, 이건 THRESHOLD/BORDERLINE_MARGIN 값을
# 실제 수집 데이터로 재검증하기 위한 1회성 진단 실행용이라 스케줄 없이
# 수동 실행(workflow_dispatch)만 지원한다. 재검증 끝나고 값이 확정되면 이
# 워크플로우는 더 안 써도 됨 (필요하면 나중에 다시 수동 실행 가능).
on:
  workflow_dispatch: {}

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치 (WATT_collector용)
        run: playwright install --with-deps chromium

      # 문서 "2.1 이슈 그룹핑" 섹션의 캐싱 예시 그대로 - 매 실행마다 BGE-M3
      # 모델(약 2.2GB)을 새로 받지 않도록 캐싱
      - name: BGE-M3 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bge-m3-model

      - name: 재검증 실행 (calibrate_issue_grouper.py)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python calibrate_issue_grouper.py 2>&1 | tee calibration_log.txt

      - name: 로그 + 원본 데이터 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-grouper-calibration-${{ github.run_id }}
          path: |
            calibration_log.txt
            calibration_raw_*.json
          retention-days: 30
