# 사료축산뉴스 큐레이션 파이프라인 - 수동 실행용 workflow
#
# (알고리즘 문서 "6. 실행/오케스트레이션" / "8. GitHub Actions 유의사항" 참조)
#
# 지금은 수동 버튼(workflow_dispatch)만 넣었습니다 - 문서 6번 섹션에
# "트리거(스케줄/수동 버튼) 분리는 4~6단계가 실제로 구현된 뒤 함께 작업할
# 예정 - 현재는 아직 손대지 않음"이라고 이미 정해져 있어서, 그 방침을
# 그대로 따랐습니다. 나중에 4~6단계(LLM 요약/저장/배포)가 붙으면 아래
# schedule 블록 주석만 풀면 매주 자동 실행도 바로 켤 수 있습니다.
#
# 실행 방법: GitHub 리포 > Actions 탭 > "사료축산뉴스 파이프라인 실행" 선택
#           > "Run workflow" 버튼 클릭
# 로그 확인: 같은 화면에서 실행 중인 job을 클릭하면 각 step의 로그가
#           실시간으로 스트리밍됩니다 (main.py의 print 출력이 그대로 보임).

name: 사료축산뉴스 파이프라인 실행

permissions:
  contents: write  # 2026-07-23 추가: 저장 레이어(5단계) 결과물(data/YYYY-WW/)을
                    # 리포에 커밋/푸시하려면 필요. 기본 GITHUB_TOKEN은 리포 설정에
                    # 따라 read-only일 수 있어 명시적으로 write 권한을 준다.

on:
  workflow_dispatch: {}
  # schedule:
  #   # 4~6단계(LLM 요약/저장/배포) 구현 완료 후 주석 해제 예정
  #   # 매주 월요일 00:00 UTC(한국 시간 09:00) - cron은 UTC 기준
  #   - cron: "0 0 * * 1"

concurrency:
  # 2026-07-23 추가: 이 workflow를 실수로 겹쳐 실행했다가(예: 버튼을 두 번
  # 누르거나, 이전 실행이 아직 도는 줄 모르고 재실행) push 충돌("!
  # [rejected] main -> main (fetch first)")로 저장 결과가 통째로 날아간
  # 사고가 실측 확인됨. group을 workflow 이름으로 고정해서, 같은 workflow가
  # 이미 돌고 있으면 새 실행이 그걸 기다리지 않고 취소하도록 함
  # (cancel-in-progress: true) - 이 파이프라인은 몇 시간씩 걸릴 수 있어서
  # 대기시키기보다는, 나중에 시작한 실행이 이기고 먼저 것은 취소되는 편이
  # 낫다고 판단.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # 로컬에서 체감 2시간 정도라 GDELT 429 재시도 등 변동을 감안해 여유 있게 설정
    # (9번 섹션 실측 - GDELT 수집만 최대 78분 걸린 사례 있음)
    timeout-minutes: 240

    steps:
      - name: 리포 체크아웃
        uses: actions/checkout@v4

      - name: 실행 전 디스크 사용량 확인
        run: df -h /

      - name: 사용 안 하는 프리인스톨 툴 정리 (디스크 확보)
        # 2026-07-15 추가 - "No space left on device" 실패 원인 대응.
        # GitHub-hosted ubuntu-latest 러너는 실행마다 완전히 새 VM을 쓰므로
        # "여러 번 실행해서 누적된 것"이 아니라, 이 파이프라인 한 번 실행에
        # 필요한 용량(PyTorch+BGE-M3+Playwright) 자체가 러너의 보장 여유
        # 공간(14GB)에 비해 크다는 게 진짜 원인. .NET/Android SDK/GHC 등
        # 이 프로젝트(Python 전용)에 전혀 안 쓰는 프리인스톨 툴을 먼저
        # 지워서 여유를 만든다 (안전하게 삭제 가능한 것으로 알려진 경로만
        # 대상 - 삭제 실패해도 파이프라인이 안 죽도록 || true 처리)
        #
        # ** 실측 확인 완료 (2026-07-15) **: 정리 전 16GB 여유(72GB 중 56GB
        # 사용, 79%) -> 정리 후 35GB 여유(37GB 사용, 52%)로 19GB 확보됨.
        # 이후 PyTorch(CPU)/requirements/Playwright 설치까지 에러 없이
        # 통과해 main.py 실행 진입까지 확인됨 - 디스크 문제 해결 검증 완료.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean
          echo "정리 후 디스크 사용량:"
          df -h /

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"  # requirements.txt 해시 기준으로 pip 캐시 자동 관리

      - name: PyTorch(CPU 전용) 우선 설치 - CUDA 휠 다운로드 방지
        # 2026-07-15 추가. sentence-transformers가 아무 설정 없이 설치되면
        # GPU(CUDA)용 PyTorch가 딸려오는데, 이 CUDA 라이브러리들이 수 GB로
        # 커서 디스크 부족의 가장 큰 원인이었음. 이 프로젝트는 BGE-M3를
        # CPU로만 돌리므로(2.1 섹션 "GPU 불필요" 명시) CPU 전용 휠을 먼저
        # 깔아두면, 이어지는 requirements.txt 설치에서 sentence-transformers가
        # 이미 설치된 torch를 그대로 쓰고 GPU 버전을 새로 안 받는다.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: 파이썬 의존성 설치
        run: pip install -r requirements.txt --no-cache-dir

      - name: Playwright 브라우저(Chromium) 설치
        # watt_collector가 Playwright로 페이지를 로드하므로 브라우저 바이너리 필요
        # (알고리즘 문서 "1. 수집 레이어" watt_collector 행 참조)
        run: playwright install --with-deps chromium

      - name: apt 캐시 정리 + 설치 후 디스크 사용량 확인
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "의존성 설치 후 디스크 사용량:"
          df -h /

      - name: BGE-M3 임베딩 모델 캐시
        # 2.1 이슈 그룹핑 섹션에 명시된 캐싱 설정 그대로 - 최초 1회만
        # 약 2.2GB를 받고, 이후 실행부터는 캐시에서 즉시 로드됨
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bge-m3-model

      - name: 파이프라인 실행 (main.py)
        env:
          # --- 필수: 네이버 뉴스 검색 API (naver_collector.py) ---
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

          # --- 선택: 구글 시트 키워드 연동 (keyword_source.py, 2026-07-17 신규) ---
          # 담당자 없이도 다른 사람이 키워드를 편하게 추가/수정할 수 있게
          # 구글 시트를 키워드 소스로 쓸 수 있게 함. 시트를 "파일 > 공유 >
          # 웹에 게시 > CSV"로 게시한 뒤 그 URL을 아래 Variable에 등록.
          # 비워두면(또는 시트 읽기 실패 시) 각 collector의 기존 하드코딩
          # 키워드 리스트로 안전하게 대체됨 - 이 값이 없어도 파이프라인은
          # 그대로 정상 동작함.
          KEYWORD_SHEET_CSV_URL: ${{ vars.KEYWORD_SHEET_CSV_URL }}

          # --- 선택: 3차 LLM 그룹핑 보조 (issue_grouper.py) ---
          # 둘 다 비워두면 3차는 "안 묶음" 기본값으로 안전하게 생략되고
          # 나머지 파이프라인(1~3단계)은 그대로 정상 동작합니다.
          # Anthropic 키 승인이 아직이라면 이 줄은 비워둔 채로 실행해도 됩니다.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # --- 임시 대체 경로 (키 승인 전까지만) ---
          # 아래 세 값을 채우면 LLM_PROVIDER=openrouter로 3차를 임시 실행할 수
          # 있습니다. 다만 이건 로컬 검증용으로 설계된 임시 경로라(9.5 섹션 -
          # 무료 모델은 예고 없이 정책이 바뀔 수 있음), Anthropic 키가 승인되면
          # 이 세 값을 지우고 위 ANTHROPIC_API_KEY만 쓰는 걸 권장합니다.
          #
          # 참고(2026-07-15 실측 확인): OPENROUTER_MODEL을 리포 Variables에
          # 등록 안 해도 이 줄 자체는 그대로 둬도 안전합니다 - GitHub가
          # 미등록 vars를 빈 문자열로 넘기는 걸 issue_grouper.py가 감지해서
          # 기본값(openrouter/free)으로 자연스럽게 대체하도록 수정함(예전엔
          # 이 부분이 버그라 model= 빈 값이 API로 그대로 나가 400 에러가
          # 났었음 - 지금은 해결됨).
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        # -u: 파이썬 stdout 버퍼링 비활성화 (2026-07-17 추가).
        # 이게 없으면 print()가 터미널이 아닌 곳(이 로그 파이프)에 출력될 때
        # 기본적으로 블록 단위로 버퍼링돼서, 실제로는 진행 중인데 로그에
        # 한동안 아무것도 안 뜨다가 나중에 한꺼번에 쏟아지는 것처럼 보이는
        # 문제가 실제로 관찰됨(HF Hub 경고 같은 stderr 메시지는 버퍼링 없이
        # 바로 나가서, 실행 순서상 더 나중인데도 화면엔 먼저 뜨는 역전
        # 현상으로 확인됨). -u를 주면 print()가 매번 즉시 flush돼서 실행
        # 상태를 실시간으로 볼 수 있다.
        run: python -u main.py

      - name: 저장 결과물(data/) 커밋 & 푸시
        # 2026-07-23 추가: storage.py가 data/YYYY-WW/에 raw.json/scored.json/
        # summary.md를 만들어도, 이 스텝이 없으면 GitHub-hosted 러너가 실행
        # 끝나고 통째로 폐기되면서 파일도 같이 사라진다(러너는 매번 완전히
        # 새 VM - "8. GitHub Actions 유의사항" 참고). data/ 폴더를 "이번 주
        # 결과물 아카이브"이자 "다음 주 지난주 대비 증감 비교의 재료"로 쓰려면
        # 반드시 리포에 커밋까지 해야 함(storage.py 모듈 docstring의 저장
        # 방식 결정 참고).
        # 변경 사항이 없으면(예: main.py가 도중에 실패해 data/ 갱신이 없는
        # 경우) commit이 빈 커밋이 되지 않도록 diff 확인 후 조건부로 실행.
        #
        # 2026-07-23 추가(2차): push가 "! [rejected] main -> main (fetch first)"
        # 로 실패하는 사고 실측 확인 - 체크아웃(job 시작 시점) 이후 원격
        # main에 이 job이 모르는 새 커밋이 생겨서(예: 같은 파이프라인을 겹쳐
        # 실행) non-fast-forward로 거부됨. 이 파이프라인은 GDELT 429
        # 백오프 때문에 체크아웃부터 push까지 최대 몇 시간씩 걸릴 수 있어
        # (job 전체 timeout-minutes: 240), 그 사이 원격이 앞서갈 여지가
        # 충분함. push 직전에 git pull --rebase로 원격 변경사항을 먼저
        # 반영해서 최신 위에 이 커밋을 얹도록 수정. rebase 자체가 충돌나면
        # (예: 같은 주차 파일을 동시에 건드린 경우) 사람이 봐야 하므로
        # 자동 해결은 시도하지 않고 그대로 실패시킨다.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "data/ 변경 사항 없음 - 커밋 생략"
          else
            git commit -m "chore: 사료축산뉴스 큐레이션 결과 저장 ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi