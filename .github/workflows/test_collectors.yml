# .github/workflows/test_collectors.yml
#
# 목적: GitHub Actions 서버 IP가 수집 대상 사이트에 차단당하는지 확인하는
# 1회성 테스트 워크플로. (알고리즘 문서 "7. 아직 결정 안 된 것들" 2번 항목,
# "8. GitHub Actions 유의사항" 2번 항목 검증용)
#
# 정식 운영 워크플로(main.py 전체 파이프라인 스케줄 실행)가 아님 - 지금은
# naver_collector / watt_collector 두 개만 개별 실행해서 "여기서 막히는지"만
# 확인하는 용도. 확인 끝나면 이 파일은 지우거나 정식 워크플로로 교체하면 됨.
#
# 사용법:
#   1. 이 파일을 리포의 .github/workflows/test_collectors.yml 경로에 추가
#   2. 리포 Settings > Secrets and variables > Actions 에서
#      NAVER_CLIENT_ID / NAVER_CLIENT_SECRET 등록 (naver_collector.py가 씀)
#   3. GitHub 리포 > Actions 탭 > 이 워크플로 선택 > "Run workflow" 버튼으로 수동 실행
#   4. 실행 로그에서 watt_collector 쪽에 403/차단 관련 에러가 뜨는지 확인

name: Test Collectors (IP 차단 여부 확인용)

on:
  workflow_dispatch:  # 수동 실행 전용 - 스케줄 없음 (테스트 목적이라 자동 실행 불필요)

jobs:
  test-naver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install requests python-dotenv

      - name: naver_collector 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python naver_collector.py
        # naver는 공식 API라 IP 차단 개념이 거의 없음 - 여기서 실패하면
        # 십중팔구 API 키/Secrets 등록 문제지 IP 차단 문제가 아님

  test-watt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps
        # --with-deps: Ubuntu 러너에 Playwright용 시스템 라이브러리까지 같이 설치
        # (이게 없으면 브라우저 실행 자체가 안 되는 경우가 있음)

      - name: watt_collector 실행 (핵심 테스트 대상)
        run: python WATT_collector.py
        # 여기서 403 Forbidden, "목록 로딩 실패 또는 타임아웃" 같은 로그가
        # 반복해서 뜨면 -> GitHub Actions IP가 차단당했다는 뜻
        # (로컬/개인 네트워크에서는 정상 작동했던 것과 비교해서 판단)
