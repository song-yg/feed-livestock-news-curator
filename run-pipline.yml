# 사료축산뉴스 큐레이션 파이프라인 - workflow
#
# (알고리즘 문서 "6. 실행/오케스트레이션" / "8. GitHub Actions 유의사항" 참조)
#
# 트리거는 두 가지:
#   1. workflow_dispatch(수동 버튼) - 테스트/임시 확인용. 실행 시 memo를
#      입력하면 Actions 목록 화면의 실행 이름과 실행 상세 페이지 요약에
#      바로 남아서, 나중에 "이 회차가 뭘 확인하려던 실행이었는지" 코드를
#      안 열어봐도 바로 알 수 있다.
#   2. schedule(매주 월요일 자동) - 실제 "이번 주 정식 큐레이션"은 이걸로.
#      on: push는 의도적으로 안 씀 - 이 파이프라인은 실행될 때마다 실제
#      이메일 발송 + LLM 호출량(일일 한도 있는 프로바이더 포함) 소모 +
#      데이터 커밋이 일어나서, 단순 코드 수정 커밋마다 전체가 돌아버리면
#      테스트/실제 실행이 뒤섞이는 문제가 생김.
#
# 실행 방법: GitHub 리포 > Actions 탭 > "사료축산뉴스 파이프라인 실행" 선택
#           > "Run workflow" 버튼 클릭 > 메모(선택) 입력 후 실행
# 로그 확인: 같은 화면에서 실행 중인 job을 클릭하면 각 step의 로그가
#           실시간으로 스트리밍됩니다 (main.py의 print 출력이 그대로 보임).

name: 사료축산뉴스 파이프라인 실행

# Actions 목록 화면에서 각 실행이 무슨 목적이었는지 바로 보이도록 회차
# 번호 + 메모를 실행 이름에 반영. workflow_dispatch로 memo를 입력하면
# 그 값이, 입력 안 하면 memo input 자체의 기본값("수동 실행 메모 없음")이
# 쓰이고, schedule(자동 실행)로 돌면 inputs 자체가 없으므로 "자동 스케줄
# 실행"으로 표시된다.
run-name: "회차 #${{ github.run_number }}: ${{ inputs.memo || '자동 스케줄 실행' }}"

permissions:
  contents: write  # 저장 레이어(5단계) 결과물(data/YYYY-WW/)을
                    # 리포에 커밋/푸시하려면 필요. 기본 GITHUB_TOKEN은 리포 설정에
                    # 따라 read-only일 수 있어 명시적으로 write 권한을 준다.

on:
  workflow_dispatch:
    inputs:
      memo:
        description: '이번 회차에 남길 메모(선택) - Actions 목록/실행 요약에 표시됨'
        required: false
        default: '수동 실행 메모 없음'
  schedule:
    # 매주 월요일 00:01 한국시간(KST, UTC+9) - cron은 UTC 기준이라
    # 전날(일요일) 15:01 UTC로 등록해야 함 (KST 00:01 - 9시간 = UTC 15:01)
    - cron: "1 15 * * 0"

concurrency:
  # 2026-07-23 추가: 이 workflow를 실수로 겹쳐 실행했다가(예: 버튼을 두 번
  # 누르거나, 이전 실행이 아직 도는 줄 모르고 재실행) push 충돌("!
  # [rejected] main -> main (fetch first)")로 저장 결과가 통째로 날아간
  # 사고가 실측 확인됨. group을 workflow 이름으로 고정해서, 같은 workflow가
  # 이미 돌고 있으면 새 실행이 그걸 기다리지 않고 취소하도록 함
  # (cancel-in-progress: true) - 이 파이프라인은 몇 시간씩 걸릴 수 있어서
  # 대기시키기보다는, 나중에 시작한 실행이 이기고 먼저 것은 취소되는 편이
  # 낫다고 판단.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  collect:
    # job1: [1] 수집만 담당. 자기 몫의 360분을 온전히 쓸 수 있어서 GDELT
    # 429 백오프가 아무리 길어져도 이 job 안에서는 여유 있음(main.py의
    # GDELT_DEADLINE_MINUTES=335 참고). 결과는 파일로 저장해서 job2에
    # artifact로 넘김(2026-08-03 - job 하나에 다 몰아넣던 예전 구조는
    # 처리 단계까지 합쳐 6시간 안에 욱여넣어야 해서 체크포인트를 계속
    # 빠듯하게 쥐어짜야 했음).
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 리포 체크아웃
        uses: actions/checkout@v4

      - name: 실행 메모 기록
        run: |
          echo "## 📝 실행 메모" >> "$GITHUB_STEP_SUMMARY"
          echo "- **회차:** #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **트리거:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **메모:** ${{ inputs.memo || '(자동 스케줄 실행 - 메모 없음)' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: 실행 전 디스크 사용량 확인
        run: df -h /

      - name: 사용 안 하는 프리인스톨 툴 정리 (디스크 확보)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean
          echo "정리 후 디스크 사용량:"
          df -h /

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 파이썬 의존성 설치
        # job1은 수집만 하므로 sentence-transformers/torch(임베딩용, job2에서만
        # 필요)는 원래 안 써도 되지만, requirements.txt 하나로 관리하는 게
        # 단순해서 그냥 같이 설치함 - 어차피 job이 나뉘어 각자 새 VM(디스크
        # 여유 있음)이라 예전처럼 디스크 압박으로 이어지진 않음.
        run: pip install -r requirements.txt --no-cache-dir

      - name: Playwright 브라우저(Chromium) 설치
        # watt_collector가 Playwright로 페이지를 로드하므로 브라우저 바이너리 필요
        run: playwright install --with-deps chromium

      - name: apt 캐시 정리
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: 수집 실행 (main.py collect)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KEYWORD_SHEET_CSV_URL: ${{ vars.KEYWORD_SHEET_CSV_URL }}
        run: python -u main.py collect

      - name: 수집 결과를 job2로 전달 (artifact 업로드)
        # main.py collect가 저장한 collected_articles.json을 job2가
        # download-artifact로 받아 이어감(main.py의 COLLECTED_ARTIFACT_PATH).
        uses: actions/upload-artifact@v4
        with:
          name: collected-articles-${{ github.run_id }}
          path: collected_articles.json
          retention-days: 1  # job2가 바로 받아쓰고 끝나므로 오래 보관할 필요 없음

  process:
    # job2: [2] 정규화 ~ [6] 배포. job1(collect)이 끝난 뒤 시작(needs).
    # 이 job도 자기 몫의 360분을 온전히 받음(main.py의 GROUPING_DEADLINE_
    # MINUTES 등 나머지 체크포인트 참고) - job1이 GDELT 때문에 아무리
    # 오래 걸렸어도 job2 시작 시점부터 새로 360분이 주어짐.
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 리포 체크아웃
        uses: actions/checkout@v4

      - name: 수집 결과 받기 (artifact 다운로드)
        uses: actions/download-artifact@v4
        with:
          name: collected-articles-${{ github.run_id }}

      - name: 실행 전 디스크 사용량 확인
        run: df -h /

      - name: 사용 안 하는 프리인스톨 툴 정리 (디스크 확보)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean
          echo "정리 후 디스크 사용량:"
          df -h /

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: PyTorch(CPU 전용) 우선 설치 - CUDA 휠 다운로드 방지
        # sentence-transformers(BGE-M3 임베딩, 2차 그룹핑)가 job2에서만 쓰임 -
        # 아무 설정 없이 설치되면 GPU(CUDA)용 PyTorch가 딸려오는데, 이
        # 프로젝트는 BGE-M3를 CPU로만 돌리므로 CPU 전용 휠을 먼저 깔아둠.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: 파이썬 의존성 설치
        run: pip install -r requirements.txt --no-cache-dir

      - name: Playwright 브라우저(Chromium) 설치
        # deploy.py의 이메일 PDF 첨부(render_email_pdf)가 Playwright로
        # HTML을 PDF로 변환하므로 job2에도 브라우저 바이너리 필요.
        run: playwright install --with-deps chromium

      - name: 한글 폰트(나눔고딕) 설치
        # deploy.py의 카테고리 트렌드 그래프(render_category_trend_chart,
        # matplotlib)가 카테고리명을 한글로 그리는데, matplotlib 기본 폰트는
        # 한글을 지원 안 해서 안 깔면 네모(tofu)로 깨짐. fonts-nanum 설치하면
        # "NanumGothic" 폰트 패밀리로 바로 쓸 수 있음.
        run: sudo apt-get install -y fonts-nanum

      - name: apt 캐시 정리 + 설치 후 디스크 사용량 확인
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "의존성 설치 후 디스크 사용량:"
          df -h /

      - name: BGE-M3 임베딩 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bge-m3-model

      - name: 처리+배포 실행 (main.py process)
        env:
          # --- 3차 LLM 그룹핑 보조 / 관련성 필터·재분류 / LLM 요약 공용 ---
          # Anthropic은 안 쓰는 걸로 확정(2026-08-03) - OpenRouter만 사용.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_MODEL_2: ${{ vars.OPENROUTER_MODEL_2 }}
          OPENROUTER_MODEL_3: ${{ vars.OPENROUTER_MODEL_3 }}
          # --- 6단계(deploy.py) 이메일 발송용 ---
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python -u main.py process

      - name: 유사도 디버그 CSV 업로드 (그룹핑 임계값 튜닝용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: similarity-debug-${{ github.run_id }}
          path: similarity_debug/similarity_scores.csv
          if-no-files-found: warn
          retention-days: 14

      - name: 저장 결과물(data/, state/) 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d data/ ]; then
            git add data/
          fi
          if [ -d state/ ]; then
            git add state/
          fi
          if git diff --cached --quiet; then
            echo "data/, state/ 변경 사항 없음 - 커밋 생략"
          else
            git commit -m "chore: 사료축산뉴스 큐레이션 결과 저장 ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi